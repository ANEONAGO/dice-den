<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Den Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap">
<style>
/* Layout: a back-room ledger. Brass header and a sticky search rail, then one section per game system; tables scroll inside their own boxes. Single dark look, like the game's felt table. */
:root{
 --bg:#140c07;--panel:#1f140c;--panel2:#2a1b10;--line:#4a3220;--ink:#f3e6c8;--muted:#b49a74;--brass:#d9a441;--brass2:#f5d37c;--felt:#1e6b45;
 --c:#a8b0b8;--u:#4fbf5c;--r:#4a8cff;--l:#ff9f1a;--secret:#b07aff;
 --display:'Cinzel',Georgia,'Times New Roman',serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#3a2416 0%,transparent 60%);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
header{padding-block:34px 18px;text-align:center}
h1{font:800 clamp(30px,6vw,52px)/1.05 var(--display);letter-spacing:.08em;margin:0;color:var(--brass2);text-shadow:0 0 18px #d9a44155;text-wrap:balance}
header p{margin:10px auto 0;max-width:62ch;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.stats span{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}
.stats b{color:var(--brass2);font-variant-numeric:tabular-nums}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.count{font:600 12px var(--body);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
nav a{flex:none;font:600 12px var(--body);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--panel)}
nav a:hover{color:var(--brass2);border-color:var(--brass)}
section{margin-top:34px;scroll-margin-top:110px}
h2{font:800 22px/1.2 var(--display);letter-spacing:.06em;color:var(--brass2);margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);margin:0 0 12px;max-width:75ch}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters button{font:600 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brass);color:#1a0e06;border-color:var(--brass)}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;text-align:left;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #33231580;vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-weight:800;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--brass2)}
.pill{display:inline-block;font:700 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.c{color:var(--c)}.pill.u{color:var(--u)}.pill.r{color:var(--r)}.pill.l{color:var(--l)}.pill.s{color:var(--secret)}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
.tagl{display:flex;flex-wrap:wrap;gap:4px}
.tagl span{font-size:12px;color:var(--brass2);border:1px solid #d9a44155;border-radius:6px;padding:1px 6px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h3{font:800 15px/1.3 var(--display);letter-spacing:.04em;margin:0 0 4px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 em{font:600 12px var(--body);font-style:normal;color:var(--brass2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card p{margin:0;color:#e4d4b4;font-size:14px}
.card .sub{margin-top:6px;font-size:12px;color:var(--muted)}
.card.secret{border-color:#b07aff88}
.odds{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:6px 0 8px}
.odds i{display:flex;align-items:center;justify-content:center;font:700 11px var(--body);color:#140c07;font-style:normal;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend b{font-variant-numeric:tabular-nums;color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
[hidden]{display:none!important}
.empty{color:var(--muted);font-style:italic;padding:10px 2px}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head><body>

const ARCANA=[['The Carver','Turn one die on the table to any face (use after a roll)',4],['The Mirror',"Copy one die's six faces onto another die",4],['The Encore','Create a copy of the last Arcana card you used',3],['The Croupier','Double your money (max +$20)',5],['The Tinker','Give a chosen die a random enhancement',4],['The Shaker','Reroll every unchained die on the table for free',3],['The Nudger','Every die on the table goes up one pip (6s stay 6)',4],['The Loader','A chosen die becomes Loaded: it rolls twice and keeps the higher',4],['The Painter','Paint a random special face onto a plain face of a chosen die',3],['The Glazier','Turn the face a chosen die is showing into Glass',3],['The Sweeper','Strip a chosen die back to plain and get $2 for every special face and enhancement removed',2],['The Tailor',"Copy one die's enhancement onto another die",4],['The Saint','Put a Heart face on two random dice',4],['The Pickpocket','Gain $1 for every die you own (max $10)',3],['The Stargazer','Level up the hand you scored last',3],['The Bookmaker','Your bets this round pay 50% more profit',3],['The Engraver','Pick a die and a face, then tap anywhere on that face to carve one more pip (a 6 can become a 7)',5],['The Understudy','A chosen relic fires twice for the rest of this round',5],['The Flipper','Turn a die on the table over to its opposite face (1 and 6, 2 and 5, 3 and 4)',3],['The Appraiser','Upgrade a random relic you own, for free',5]];
const BOSSES=[['Short Stack','Only 2 throws this round'],['Tight Table','Score at most 3 dice per throw'],['Lights Out','Two relics are switched off (never the first boss)'],['The Pit Boss',"Chained dice can't be scored this round"],['Snake Oil','1s and 2s score no chips'],['Cold Dice','No rerolls this round'],['Rusty Chains','No dice get chained this round'],['The Taxman','Every throw you score costs $2']];
const TAGS=[['Coupon Tag','Everything in your next shop is free, except House Rules and slots'],['Double Tag','Copies the next tag you get'],['Investment Tag','+$15 when you beat the next boss'],['Charm Tag','A free Relic Pack in your next shop'],['Handy Tag','+$1 per throw played this run, paid right away'],['Arcana Tag','An Arcana card right away ($3 if your Arcana slots are full)']];
const RULES=[['Seventh Seat','Every throw rolls one more die',12],['Weighted Cup','The first die of every throw rolls twice and keeps the higher',9],["Regular's Tab",'Everything in the shop costs $1 less',10],['Sticky Felt','+1 chained die (keep up to 3 between throws)',10],['House Odds','Winning bets pay 15% more profit',8],['Spare Cup','+1 throw every round',14],['Card Case','+1 Arcana slot',8],["Croupier's Tip",'+$2 every time you clear a round',10]];
const PACKS=[['Dice Pack','Roll 3 new dice and keep one. Higher rolls make better dice',6],['Mega Dice Pack','Roll 5 new dice and keep two',10],['Face Pack','Pick 1 of 3 face paints, then choose exactly which die and face to paint',5],['Relic Pack','Pick 1 of 3 relics, all Uncommon or better',9],['Arcana Pack','Pick 1 of 3 Arcana cards to keep for later',4],['Chart Pack','Pick 1 of 3 Star Charts',5]];
const DSETS=[['Classic Set','Plain white dice with black pips. No tricks, no penalties.','Unlocked from the start'],['Bone Set','Start with 2 rerolls per throw instead of 1.','Clear round 3 in any run'],['Gilded Set','Every 6 scored earns $1.','Hold $25 at once'],['Glass Set','Every die starts with Glass on faces 5 and 6: double chips, 25% to shatter.','Shatter 3 glass faces in one run'],['Obsidian Set','8 heavy black dice: every throw rolls 8 (you still score up to 5), every scored die gets +4 chips, and up to 3 dice can be chained.','Beat a boss round without using a reroll'],['Brass Set','Start with $10 in your pocket.','Score 1,000 or more in a single throw']];
const BETS=[['Score to spare','The round ends on 150% of the target or more'],['Triplets or better','Your first throw scores Triplets, Full House, Quads or Quints'],['Called shot','Score a named hand this round'],['Big throw','Score a set number or more in one throw']];
const CHALL=[['Speed run','Clear the round in 2 throws or fewer'],['Overkill','Finish with 130% of the target score'],['No rerolls','Clear the round without rerolling'],['Combo hunter','Score Triplets or better']];
const ACH=[['Opening Night','Clear your first round'],['Boss Breaker','Beat a boss round'],['Pip Storm','Score Quints'],['Full Set','Merge a relic set into one card'],['Lucky Streak','Win 5 bets in one run'],['Deep Pockets','Hold $50 at once'],['Ten Grand','Score 10,000 in one throw'],['Legendary','Own a Legendary relic'],['Card Sharp','Use 10 Arcana cards in one run'],['Big Bag','Own 15 dice'],['Beat the Den','Clear round 15'],['Night Owl','Reach round 20']];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=(k,t)=>`<span class="pill ${k}">${esc(t||RAR[k])}</span>`;
const price={c:5,u:7,r:9,l:13};
const cards=(L,f)=>`<div class="grid">${L.map(f).join('')}</div>`;
const card=(t,em,p,sub,cls)=>`<div class="card ${cls||''}" data-s><h3><span>${esc(t)}</span>${em?`<em>${esc(em)}</em>`:''}</h3><p>${esc(p)}</p>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
const S=[];
S.push(['relics','Relics',`${RELICS.length} relics`,`Relics fire as you score. "When" is the scoring step: per die as it scores, after all the dice, last (multipliers), replaying dice, or passive. Level 2 is the shop upgrade.`,
 `<div class="filters" role="group" aria-label="Filter relics by rarity"><button aria-pressed="true" data-r="">All</button>${Object.entries(RAR).map(([k,v])=>`<button aria-pressed="false" data-r="${k}">${v} · $${price[k]}</button>`).join('')}</div>
 <div class="tbox"><table><thead><tr><th>Relic</th><th>Rarity</th><th>When</th><th>Level 1</th><th>Level 2</th><th>Sets</th></tr></thead><tbody>${RELICS.map(r=>`<tr data-s data-rar="${r[1]}"><td class="n">${esc(r[0])}</td><td>${pill(r[1])}</td><td class="when">${WHEN[r[2]]}</td><td>${esc(r[3])}</td><td class="up">${esc(r[4])}</td><td><div class="tagl">${r[5]?r[5].split(', ').map(s=>`<span>${esc(s)}</span>`).join(''):''}</div></td></tr>`).join('')}</tbody></table></div>`]);
S.push(['sets','Relic sets',`${SETS.length} sets`,'Own every relic in a set and they merge into one card that takes a single slot and adds the set bonus. A relic can count toward more than one set.',
 cards(SETS,s=>card(s[0],s[1].split(', ').length+' relics',s[2],esc(s[1])))]);
S.push(['throwsets','Throw sets',`${FSETS.length} bonuses`,'Bonuses for the special faces and charms you score together in one throw.',cards(FSETS,f=>card(f[0],'',f[1]))]);
S.push(['hands','Hands','10 listed + 3 secret',"Your score is chips × mult. Each hand adds its chips before the dice score, and sets the starting mult. Star Charts add +1 mult and +5 chips per level. Secret hands need the Sixth Sense relic and never appear in the game's Combos menu.",
 `<div class="tbox"><table><thead><tr><th>Hand</th><th>Pattern</th><th>Dice</th><th>Chips</th><th>Mult</th></tr></thead><tbody>${HANDS.map(h=>`<tr data-s><td class="n">${esc(h[0])} ${h[5]?pill('s','Secret'):''}</td><td>${esc(h[1])}</td><td class="num">${h[4]}</td><td class="num">+${h[3]}</td><td class="num">×${h[2]}</td></tr>`).join('')}</tbody></table></div>`]);
S.push(['charts','Star Charts',`${CHARTS.length} charts`,'Level up hands. Sold in the shop (one per visit) and in Chart Packs.',cards(CHARTS,c=>card(c[0],RAR[c[2]],'Levels up: '+c[1]))]);
S.push(['faces','Special faces',`${FACES.length} faces`,'Painted onto one face of a die from the shop or a Face Pack.',cards(FACES,f=>card(f[0],'$'+f[2],f[1]))]);
S.push(['charms','Charms',`${CHARMS.length} charms`,'One per die. Buying a charm turns a die you choose into that kind of die.',cards(CHARMS,c=>card(c[0],'$'+c[3],c[2],'Sold as '+esc(c[1])))]);
S.push(['seals','Seals',`${SEALS.length} seals`,'One per die, shown as a coloured dot.',cards(SEALS,s=>card(s[0],'$'+s[2],s[1]))]);
S.push(['editions','Relic editions',`${EDS.length} editions`,'Now and then a relic offer comes in a shimmering edition that costs a little more.',cards(EDS,e=>card(e[0],e[2]+'% · +$'+e[3],e[1]))]);
S.push(['arcana','Arcana cards',`${ARCANA.length} cards`,'Held cards (2 slots to start) you use whenever you like by tapping them above the table.',cards(ARCANA,a=>card(a[0],'$'+a[2],a[1]))]);
S.push(['bosses','Bosses',`${BOSSES.length} bosses`,'Every 5th round. The target is ×1.3 at round 5, then +0.05 every five rounds. Beating one pays $6 plus two prizes.',cards(BOSSES,b=>card(b[0],'',b[1]))]);
S.push(['tags','Tags',`${TAGS.length} tags`,'Skip a normal round on the betting screen to take its tag (no money and no shop that round).',cards(TAGS,t=>card(t[0],'',t[1]))]);
S.push(['rules','House Rules',`${RULES.length} rules`,'One appears in every shop. Bought once, they last the whole run.',cards(RULES,r=>card(r[0],'$'+r[2],r[1]))]);
S.push(['packs','Booster packs',`${PACKS.length} packs`,'One random pack in every shop.',cards(PACKS,p=>card(p[0],'$'+p[2],p[1]))]);
S.push(['gamble','Mystery Relic','$5 gamble',"A random relic, or a dud. The case spins first, then the relic joins (and merges any set it completes).",
 `<div class="card" data-s><h3><span>Mystery Relic odds</span><em>$5</em></h3><div class="odds" role="img" aria-label="Dud 15%, Common 48%, Uncommon 25%, Rare 9.5%, Legendary 2.5%">${[['Dud',15,'#6b5a48'],['Common',48,'var(--c)'],['Uncommon',25,'var(--u)'],['Rare',9.5,'var(--r)'],['Legendary',2.5,'var(--l)']].map(([n,v,c])=>`<i style="flex:${v};background:${c}">${v>=9?v+'%':''}</i>`).join('')}</div><div class="legend">${[['Dud',15],['Common',48],['Uncommon',25],['Rare',9.5],['Legendary',2.5]].map(([n,v])=>`<span>${n} <b>${v}%</b></span>`).join('')}</div><div class="sub">Relics in the shop by rarity: Common 60%, Uncommon 28%, Rare 10%, Legendary 2%.</div></div>`]);
S.push(['dicesets','Dice sets',`${DSETS.length} sets`,'Chosen at the start of a run, like a deck. The Player profile unlocks them by challenges; the Test profile has them all.',cards(DSETS,d=>card(d[0],'',d[1],'Unlock: '+esc(d[2])))]);
S.push(['bets','Bets and bonuses',`${BETS.length} bets · ${CHALL.length} challenges`,'Bets: up to 3 per round at $1, $3 or $5; odds are simulated from your dice with a 10% house edge and settle when the round ends. Each round also has one bonus challenge that pays a prize.',
 cards([...BETS.map(b=>['Bet',...b]),...CHALL.map(c=>['Bonus',...c])],x=>card(x[1],x[0],x[2]))]);
S.push(['achievements','Achievements',`${ACH.length} achievements`,'Player profile only.',cards(ACH,a=>card(a[0],'',a[1]))]);
S.push(['basics','The basics','Core rules','How a run works, with the numbers the game uses.',`<div class="rules">${[
 ['Throws','3 throws a round to reach the target. Each throw rolls 7 dice (pick which from your bag when you own more).'],
 ['Scoring','Pick up to 5 dice (6 with Sixth Sense) in the order they should score. Only dice that form the hand can score, plus Kicker and Stone dice.'],
 ['Rerolls','1 reroll per throw to start, up to 3 from the shop. A reroll throws at most 5 dice.'],
 ['Chains','Up to 2 unscored dice get chained to the table for your next throw (3 with Obsidian or Sticky Felt).'],
 ['Targets','(100 + 45r + 12r²), then ×1.1 for every round after round 8. Round 15 needs 6,772; round 20 needs 18,203.'],
 ['Money','Clearing a round pays $3 + $1 per throw left. Win the run by clearing round 15, then keep going.']].map(([t,p])=>card(t,'',p)).join('')}</div>`]);

const main=document.getElementById('main'),nav=document.getElementById('nav');
main.innerHTML=S.map(([id,t,sm,lede,body])=>`<section id="${id}" data-sec><h2>${esc(t)} <small>${esc(sm)}</small></h2><p class="lede">${esc(lede)}</p>${body}<p class="empty" hidden>Nothing here matches your search.</p></section>`).join('');
nav.innerHTML=S.map(([id,t])=>`<a href="#${id}">${esc(t)}</a>`).join('');
document.getElementById('stats').innerHTML=[[RELICS.length,'relics'],[SETS.length,'sets'],[HANDS.length,'hands'],[ARCANA.length,'Arcana'],[BOSSES.length,'bosses'],[DSETS.length,'dice sets']].map(([n,t])=>`<span><b>${n}</b> ${t}</span>`).join('');
let rar='';
function apply(){const q=document.getElementById('q').value.trim().toLowerCase();let shown=0;
 document.querySelectorAll('[data-sec]').forEach(sec=>{let any=0;sec.querySelectorAll('[data-s]').forEach(el=>{const ok=(!q||el.textContent.toLowerCase().includes(q))&&(!rar||!el.dataset.rar||el.dataset.rar==rar);el.hidden=!ok;if(ok){any++;shown++}});
  sec.querySelector('.empty').hidden=!!any;sec.hidden=!!q&&!any});
 document.getElementById('count').textContent=q||rar?shown+' matches':''}
document.getElementById('q').addEventListener('input',apply);
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{rar=b.dataset.r;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));apply()}));
apply();
</script>
</body></html>

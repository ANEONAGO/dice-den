<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).steel{background:linear-gradient(135deg,#f4f8fb,#aab7c4 42%,#e3eaf0 52%,#8794a1)!important}.die.en.steel i.on{background:#1e2a36}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).lucky{background:radial-gradient(circle at 30% 28%,#d8fbd8,#6fcf7a 60%,#3f9a4b)!important}.die.en.lucky i.on{background:#0d3a14}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).golden{background:radial-gradient(circle at 30% 28%,#fff1b8,#f0c040 55%,#b8861a)!important}.die.en.golden i.on{background:#4a3000}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).heavy{background:radial-gradient(circle at 30% 28%,#8b8b98,#55555f 60%,#3a3a42)!important}.die.en.heavy i.on{background:#ecebf4}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).bonus{background:radial-gradient(circle at 30% 28%,#bcdcff,#4a8fe8 60%,#2a5fb0)!important}.die.en.bonus i.on{background:#fff}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).fortune{background:radial-gradient(circle at 30% 28%,#e6d4ff,#9b6ad8 60%,#6a3fa8)!important}.die.en.fortune i.on{background:#fff}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).wild{background:conic-gradient(from 30deg,#ffb0b0,#ffe9a0,#b8f5c0,#b0dcff,#dcc4ff,#ffb0b0)!important}.die.en.wild i.on{background:#2a1a3a}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).glass{background:linear-gradient(135deg,#eefaffd9,#a7dcf5b3 45%,#e2f6ffd9 55%,#8ccbeacc)!important;box-shadow:0 4px 6px #0009,inset 0 0 12px #ffffffaa}.die.en.glass i.on{background:#1c5a7a}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).wing{background:radial-gradient(circle at 30% 28%,#ffe2c4,#f39a4a 60%,#c0622a)!important}.die.en.wing i.on{background:#3a1806}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).living{background:radial-gradient(circle at 30% 28%,#d4fff1,#3fc9a8 58%,#14806a)!important}.enb.living{background:#5fe0bf;font-size:13px}
/* Living Charm: the die shows numbers (its faces drift past 6 and below 1); it breathes on the table and its number swells when it grows */
.lnum{position:absolute;inset:0;display:grid;place-items:center;container-type:size;pointer-events:none;border-radius:inherit;color:#1a1a1a}.lnum span{display:inline-block;font:800 60cqh/1 Georgia,serif;letter-spacing:-.04em}.lnum.w span{font-size:52cqh}.lnum.ww span{font-size:38cqh}
.die.en.living .lnum{color:#053a32}.lnum.neg,.die.en.living .lnum.neg{color:#c0392b}.felt .die.en.living>.lnum{animation:alive 2.8s ease-in-out infinite}
@keyframes alive{50%{box-shadow:inset 0 0 12px 2px #b4ffe8cc}}.die.grow>.lnum,.felt .die.en.living.grow>.lnum{animation:lglow .8s ease-out}.die.grow>.lnum span{animation:lgrow .7s ease-out}

<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).steel{background:linear-gradient(135deg,#f4f8fb,#aab7c4 42%,#e3eaf0 52%,#8794a1)!important}.die.en.steel i.on{background:#1e2a36}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).lucky{background:radial-gradient(circle at 30% 28%,#d8fbd8,#6fcf7a 60%,#3f9a4b)!important}.die.en.lucky i.on{background:#0d3a14}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).golden{background:radial-gradient(circle at 30% 28%,#fff1b8,#f0c040 55%,#b8861a)!important}.die.en.golden i.on{background:#4a3000}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).heavy{background:radial-gradient(circle at 30% 28%,#8b8b98,#55555f 60%,#3a3a42)!important}.die.en.heavy i.on{background:#ecebf4}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).bonus{background:radial-gradient(circle at 30% 28%,#bcdcff,#4a8fe8 60%,#2a5fb0)!important}.die.en.bonus i.on{background:#fff}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).fortune{background:radial-gradient(circle at 30% 28%,#e6d4ff,#9b6ad8 60%,#6a3fa8)!important}.die.en.fortune i.on{background:#fff}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).wild{background:conic-gradient(from 30deg,#ffb0b0,#ffe9a0,#b8f5c0,#b0dcff,#dcc4ff,#ffb0b0)!important}.die.en.wild i.on{background:#2a1a3a}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).glass{background:linear-gradient(135deg,#eefaffd9,#a7dcf5b3 45%,#e2f6ffd9 55%,#8ccbeacc)!important;box-shadow:0 4px 6px #0009,inset 0 0 12px #ffffffaa}.die.en.glass i.on{background:#1c5a7a}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).wing{background:radial-gradient(circle at 30% 28%,#ffe2c4,#f39a4a 60%,#c0622a)!important}.die.en.wing i.on{background:#3a1806}
.die.en:where(:not(.m):not(.g):not(.x):not(.s):not(.h):not(.r):not(.i):not(.b):not(.a)).living{background:radial-gradient(circle at 30% 28%,#d4fff1,#3fc9a8 58%,#14806a)!important}.enb.living{background:#5fe0bf;font-size:13px}
/* Living Charm: the die shows numbers (its faces drift past 6 and below 1); it breathes on the table and its number swells when it grows */
.lnum{position:absolute;inset:0;display:grid;place-items:center;container-type:size;pointer-events:none;border-radius:inherit;color:#1a1a1a}.lnum span{display:inline-block;font:800 60cqh/1 Georgia,serif;letter-spacing:-.04em}.lnum.w span{font-size:52cqh}.lnum.ww span{font-size:38cqh}
.die.en.living .lnum{color:#053a32}.lnum.neg,.die.en.living .lnum.neg{color:#c0392b}.felt .die.en.living>.lnum{animation:alive 2.8s ease-in-out infinite}
@keyframes alive{50%{box-shadow:inset 0 0 12px 2px #b4ffe8cc}}.die.grow>.lnum,.felt .die.en.living.grow>.lnum{animation:lglow .8s ease-out}.die.grow>.lnum span{animation:lgrow .7s ease-out}

 box-shadow:inset 0 0 0 2px #d9a44166,inset 0 0 60px #000b,0 14px 34px #000c,0 0 0 2px #1a0d04,0 0 0 4px #8a5a2a66}
.table::before{content:'';position:absolute;inset:8px;border:1px dashed #f5d37c26;border-radius:18px;pointer-events:none}
.line{font-family:var(--display);letter-spacing:4px}
/* chip-style action buttons */
.btns>button:not(.small){position:relative;padding:12px 24px;border-radius:999px;font-family:var(--display);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:14px}
.btns>button:not(.small)::after{content:'';position:absolute;inset:4px;border-radius:999px;border:2px dashed #ffffff55;pointer-events:none}
.btns>button.alt:not(.small)::after{border-color:#ffffff40}
/* shop: wood-panel wall behind the counter, a hanging sign, and cards that catch the light */
.shophd{background:var(--grain),linear-gradient(180deg,#7a4a24,#4a2810);border-radius:10px;position:relative;margin-top:22px}
.shophd::before,.shophd::after{content:'';position:absolute;top:-22px;width:2px;height:22px;background:linear-gradient(#8a8f99,#45484f)}.shophd::before{left:18%}.shophd::after{right:18%}
.sh1{font-family:var(--display);font-weight:800}
.sec{background:var(--noise),linear-gradient(180deg,#2a1c10,#1a110a)}
.card{transition:transform .18s ease,box-shadow .2s;transform-style:flat;overflow:visible}.card::after{border-radius:inherit}.card.tilt{box-shadow:0 14px 26px #000b}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),#ffffff1c,transparent 45%);opacity:0;transition:opacity .2s}.card.tilt::after{opacity:1}
.card b{font-family:var(--display);letter-spacing:.3px}
.sbox{background:var(--noise),linear-gradient(180deg,#22160d,#140d07)}.sbox .cm,.tot{font-family:var(--display);font-weight:800}
.cc{text-shadow:0 0 12px #6cc6ff88}.mm{text-shadow:0 0 12px #ff6b5a88}
.panel{background:var(--noise),linear-gradient(180deg,#22160d,#160e08)}
/* particles and screen shake */
.prt{position:fixed;z-index:99;width:8px;height:8px;border-radius:50%;pointer-events:none;box-shadow:0 0 6px currentColor}.prt.sq{border-radius:2px;width:7px;height:11px}.prt.cn{width:10px;height:10px;box-shadow:inset 0 0 0 2px #b8860b}
#app.quake{animation:quake .45s cubic-bezier(.36,.07,.19,.97)}@keyframes quake{10%,90%{translate:-2px 0}20%,80%{translate:4px 1px}30%,50%,70%{translate:-6px -1px}40%,60%{translate:6px 1px}}
@media (prefers-reduced-motion:reduce){h1.neon,h1.neon .fl,#app.quake{animation:none}}
/* Kenney Boardgame Pack art (CC0) */
.chipb img{width:22px;height:22px;display:block;margin:0 auto 1px;filter:drop-shadow(0 1px 1px #0008)}.bb button.chipb{padding:5px 9px}.chipb.allin{border-color:#ffd24a;box-shadow:0 0 10px #ffd24a55}
.hudchip{width:18px;height:18px;filter:drop-shadow(0 1px 1px #000a)}

.stack{position:absolute;top:-14px;z-index:3;width:34px;height:60px;cursor:pointer}.stack.l{left:calc(20px + var(--k)*44px)}.stack.r{right:calc(20px + var(--k)*44px)}.stack b{position:absolute;left:50%;bottom:-16px;translate:-50% 0;font-size:10px;color:#f5d37c;text-shadow:0 1px 2px #000;white-space:nowrap}

/* glossy icon discs and illustrated shop art */
.ico .gl{fill:#ffffff;opacity:.13}.ico g *{stroke:#fff7e6;filter:drop-shadow(0 .6px .4px #0009)}.ico g .f{fill:#fff7e6}
.card .ic{display:flex;align-items:center;justify-content:center;min-height:56px}
.artdie.die.mini{width:52px;height:52px;padding:6px;border-radius:11px;box-shadow:0 4px 8px #000a,inset 0 -3px 0 #0002;cursor:default;position:relative;transform:rotate(-8deg)}

.kd{position:relative;width:64px;height:56px}.kd img{position:absolute;width:40px;height:40px;filter:drop-shadow(0 4px 4px #000a);transition:transform .25s}
.kd.two img:nth-child(1){left:2px;top:10px;transform:rotate(-14deg)}.kd.two img:nth-child(2){left:24px;top:2px;transform:rotate(12deg)}

.kbrush{position:absolute;right:0;bottom:0}.kbrush .ico{width:30px;height:30px}
.kd .pkb{position:absolute;right:-8px;bottom:-6px;z-index:1}.card .ic .kd .pkb .ico{width:26px;height:26px;filter:drop-shadow(0 2px 3px #000c)}
.kd.chip img{left:8px;top:4px;width:48px;height:48px}.kd.chip span{position:absolute;left:8px;top:4px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 1px #000)}.kd.chip .si{width:24px;height:24px}
.tarot{position:relative;width:46px;height:62px;transform:rotate(-6deg);transition:transform .25s}.tarot img{width:100%;height:100%;border-radius:5px;box-shadow:0 4px 10px #000b;display:block}
.tarot span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.tarot span .ico{width:34px;height:34px}
.card .ic .tarot .ico,.card .ic .kd .ico{filter:none}
.sec-counter .card{grid-template-columns:72px 1fr auto}
.felt .die.glide{transition:left .4s cubic-bezier(.3,1.2,.5,1),top .4s cubic-bezier(.3,1.2,.5,1),transform .4s ease!important}
.felt .die.held{box-shadow:0 18px 22px #000a,0 0 0 2px #ffffff44;translate:0 -10px}.d3 .felt .die.held{box-shadow:none;translate:none}
.chains.gold{filter:sepia(1) saturate(4) hue-rotate(-10deg) drop-shadow(0 1px 1px #000a)}
.fan{position:relative;width:76px;height:56px}.fan .artdie.die.mini{position:absolute;width:38px;height:38px;padding:4px;border-radius:8px}.fan .artdie:nth-child(1){left:0;top:12px;transform:rotate(-16deg)}.fan .artdie:nth-child(2){left:19px;top:2px;transform:rotate(0)}.fan .artdie:nth-child(3){left:38px;top:12px;transform:rotate(16deg)}
.card .ic *{transition:none}
.tog{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;width:max-content}.tog input{display:none}.tog span{position:relative;width:34px;height:18px;border-radius:9px;background:#3a2416;border:1px solid #5a3a1e;transition:background .2s}.tog span::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#c9b48a;transition:left .2s,background .2s}.tog input:checked+span{background:#2f7a4c}.tog input:checked+span::after{left:18px;background:#f5d37c}
.prof.daily{border-top-color:#b07aff}.prof.hs{border-top-color:#4fbf5c}
.lbp{max-width:640px}.lbt{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.lbt th,.lbt td{padding:6px 5px;text-align:left;border-bottom:1px solid #ffffff14}.lbt th{color:#a8946c;font-weight:600;font-size:11px;text-transform:uppercase}.lbt tr.me td{color:#e8c36a;font-weight:700}
.lbt td:nth-child(n+3),.lbt th:nth-child(n+3){text-align:right}@media(max-width:520px){.lbt td:nth-child(6),.lbt th:nth-child(6),.lbt td:nth-child(5),.lbt th:nth-child(5){display:none}}.lbv{font-size:11px;color:var(--muted);white-space:nowrap}.lbv.old b{font-size:10px;color:#ffb35a;border:1px solid #ffb35a66;border-radius:5px;padding:0 4px}.mtabs.lbm{margin-top:-4px}.mtabs.lbm button{font-size:11px;padding:4px 10px;min-height:0}
.postb{margin:10px auto;max-width:520px;text-align:center;padding:10px;border:1px solid #5a3a1e;border-radius:10px;background:#00000033}.postb small{display:block;color:#c9b48a;margin:4px 0}

.mmdaily{margin:16px 0 0;font-size:12px;color:var(--muted)}.mmdaily .si{width:14px;height:14px;vertical-align:-2px;color:var(--brass2)}

/* main menu on wide screens: the title and big buttons on the left, larger tiles on the right */
@media (min-width:900px){
 .mmenu{max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px 40px;align-items:center;min-height:calc(100vh - 80px);text-align:left}
 .mmhero{display:flex;flex-direction:column;align-items:flex-start}.mmhero h1.neon.big{font-size:clamp(46px,5.2vw,76px);margin:0 0 4px;text-align:left}.mmenu .tagline{text-align:left;margin:0 0 22px}
 .mmstats{text-align:left;margin:10px 0 20px}.mmmain{width:100%;max-width:440px}.mmbig{min-height:76px;font-size:21px;justify-content:flex-start;padding-left:26px}.mmbig .si{width:30px;height:30px}
 .mmtiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mmtiles .stile{padding:18px 8px 15px;gap:6px}.mmtiles .stile .sic{width:54px;height:54px}.mmtiles .stile .sic .si{width:28px;height:28px}.mmtiles .stile b{font-size:15px}.mmtiles .stile small{font-size:12px}

<style>

.die.ld::before{content:'';position:absolute;bottom:2px;left:3px;width:10px;height:10px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'none'%20stroke-width%3D'2.4'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20fill%3D'%23c43'%20stroke%3D'none'%20d%3D'M12%202l3%207%207%20.6-5.4%204.7%201.7%207.2L12%2017.6%205.7%2021.5l1.7-7.2L2%209.6%209%209z'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}

.btns{display:flex;gap:10px;justify-content:center}

.die{transition:transform .25s,scale .1s}

.die{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.dmen{max-width:980px}.dmen h2 small{font:600 13px var(--sans)}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin:8px 0}.dcard{background:#140c06;border:1px solid #4b3320;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}.dcard.fam{border-color:#7fd4f566}.dch{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.dch b{font:700 13px var(--sans);color:var(--ivory);margin-right:2px}.dtag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 6px;border-radius:7px;border:1px solid var(--tc);color:var(--tc)}.dtag .si{width:11px;height:11px}.dfaces{display:flex;gap:4px;justify-content:space-between}.dch button{margin-left:auto;padding:2px 9px;min-height:24px;font-size:10.5px}@media(max-width:600px){.dgrid{grid-template-columns:1fr}.dfaces .fc3{width:40px;height:40px}.dfaces .fc3 img{width:38px;height:38px}}

.sbox{position:relative;scroll-margin-bottom:96px}
.offl{display:inline-block;background:#c0392b;color:#fff;font-size:9px;font-weight:bold;letter-spacing:1px;padding:1px 5px;border-radius:6px;margin-right:4px}
.ico{width:1.35em;height:1.35em;vertical-align:-.35em}.ico .bg{stroke:var(--rc);stroke-width:1.6}

.card{position:relative}.card.cset{border-color:#ffd24a;animation:glow 1.3s ease-in-out infinite}

.empty{color:#ffffff66;font-size:13px;letter-spacing:2px;align-self:center}

.kd.chip img{left:8px;top:4px;width:48px;height:48px}.kd.chip span{position:absolute;left:8px;top:4px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;filter:drop-shadow(0 1px 1px #000)}.kd.chip .si{width:24px;height:24px}
.tarot{position:relative;width:46px;height:62px;transform:rotate(-6deg);transition:transform .25s}.tarot img{width:100%;height:100%;border-radius:5px;box-shadow:0 4px 10px #000b;display:block}
.tarot span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.tarot span .ico{width:34px;height:34px}
.card .ic .tarot .ico,.card .ic .kd .ico{filter:none}
.sec-counter .card{grid-template-columns:72px 1fr auto}
.felt .die.glide{transition:left .4s cubic-bezier(.3,1.2,.5,1),top .4s cubic-bezier(.3,1.2,.5,1),transform .4s ease!important}
.felt .die.held{box-shadow:0 18px 22px #000a,0 0 0 2px #ffffff44;translate:0 -10px}.d3 .felt .die.held{box-shadow:none;translate:none}
.chains.gold{filter:sepia(1) saturate(4) hue-rotate(-10deg) drop-shadow(0 1px 1px #000a)}
.fan{position:relative;width:76px;height:56px}.fan .artdie.die.mini{position:absolute;width:38px;height:38px;padding:4px;border-radius:8px}.fan .artdie:nth-child(1){left:0;top:12px;transform:rotate(-16deg)}.fan .artdie:nth-child(2){left:19px;top:2px;transform:rotate(0)}.fan .artdie:nth-child(3){left:38px;top:12px;transform:rotate(16deg)}
.card .ic *{transition:none}
.tog{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;width:max-content}.tog input{display:none}.tog span{position:relative;width:34px;height:18px;border-radius:9px;background:#3a2416;border:1px solid #5a3a1e;transition:background .2s}.tog span::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#c9b48a;transition:left .2s,background .2s}.tog input:checked+span{background:#2f7a4c}.tog input:checked+span::after{left:18px;background:#f5d37c}
.prof.daily{border-top-color:#b07aff}.prof.hs{border-top-color:#4fbf5c}
.lbp{max-width:640px}.lbt{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.lbt th,.lbt td{padding:6px 5px;text-align:left;border-bottom:1px solid #ffffff14}.lbt th{color:#a8946c;font-weight:600;font-size:11px;text-transform:uppercase}.lbt tr.me td{color:#e8c36a;font-weight:700}
.lbt td:nth-child(n+3),.lbt th:nth-child(n+3){text-align:right}@media(max-width:520px){.lbt td:nth-child(6),.lbt th:nth-child(6),.lbt td:nth-child(5),.lbt th:nth-child(5){display:none}}.lbv{font-size:11px;color:var(--muted);white-space:nowrap}.lbv.old b{font-size:10px;color:#ffb35a;border:1px solid #ffb35a66;border-radius:5px;padding:0 4px}.mtabs.lbm{margin-top:-4px}.mtabs.lbm button{font-size:11px;padding:4px 10px;min-height:0}
.postb{margin:10px auto;max-width:520px;text-align:center;padding:10px;border:1px solid #5a3a1e;border-radius:10px;background:#00000033}.postb small{display:block;color:#c9b48a;margin:4px 0}
.postb input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #5a3a1e;background:#1a0f07;color:#f3e6c8;min-width:0;flex:1 1 140px}
.felt .die.same{filter:brightness(1.22) saturate(1.15);box-shadow:0 0 0 2px #ffc861,0 0 18px #ffc86199}.d3 .felt .die.same{filter:none;box-shadow:none}

/* compact HUD (round, score, throws, money) and a bigger relic bar */
.hud{gap:5px;margin-bottom:8px}.hud div{display:grid;grid-template-columns:auto auto;align-items:center;justify-content:center;column-gap:4px;row-gap:0;padding:4px 4px 3px;font-size:9px;letter-spacing:.8px;border-radius:8px}.hud div>.si,.hud div>.hudchip{grid-column:1;margin:0}.hud div>b,.hud div>small{grid-column:1/-1}.hud div:nth-child(2) small{display:none}.hud div>.si{width:12px;height:12px}.hud b{font-size:15px;line-height:1.15}.hud small{font-size:9px}.hudchip{width:13px;height:13px}
.slots{gap:8px}.slot{width:58px;height:58px;border-radius:13px}.slot .ico{width:44px;height:44px}.slot.merged{min-width:58px;padding:0 8px}.slot.merged .ico{width:38px;height:38px}.slot.merged i{margin:0 -6px}
.slot .plus{width:17px;height:17px;font-size:13px;line-height:17px}.slot .offl,.slot .orc{bottom:-8px}
@media (min-width:1000px){.hud{max-width:760px}.hud b{font-size:17px}.slot{width:72px;height:72px;border-radius:15px}.slot .ico{width:56px;height:56px}.slot.merged{min-width:72px}.slot.merged .ico{width:48px;height:48px}.slots{gap:10px}}

.actbar{position:sticky;bottom:10px;z-index:30;margin:10px auto;padding:8px;border-radius:16px;background:rgba(18,11,6,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 8px 24px #000c,0 0 0 1px #4b332088;max-width:560px}
.actbar button{flex:1;min-height:48px;font-size:15px}.actbar button small{display:block;font:600 10.5px Inter,sans-serif;letter-spacing:0;text-transform:none;opacity:.8;margin-top:1px}
.coach.inl,.tutc.inl{position:static;left:auto;right:auto;bottom:auto;transform:none;translate:none;width:auto;max-width:560px;margin:4px auto 10px}#app.tutpad{padding-bottom:300px}

/* tutorial card: top-left corner on phones (folds to a tab), a left column on wide screens */
.tutc,.tutc.inl{position:fixed;left:8px;right:auto;top:8px;bottom:auto;translate:none;margin:0;width:min(64vw,300px);max-height:46vh;overflow:auto;padding:9px 11px;z-index:58}
.tutc p{font-size:13px;margin:5px 0 7px}.tuth{cursor:pointer;user-select:none}.tuth .tmin{all:unset;margin-left:6px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:800 15px var(--sans);color:#0d1a26;background:#7fd4f5;cursor:pointer}
.tutc.min{width:auto;padding:6px 10px;border-radius:12px}.tutc.min p,.tutc.min .btns{display:none}
#app.tutpad{padding-bottom:28px}
@media (min-width:1000px){.tutc{top:110px;left:16px;width:300px;max-height:calc(100vh - 140px)}#app.tutpad{padding-left:340px}.tutc p{font-size:14px}}

/* main menu */
.mmenu{max-width:560px;margin:0 auto;text-align:center}.mmenu .tagline{margin-bottom:14px}
.mmprof{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:#120b06;border:1px solid var(--line)}.mmprof button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;font:700 13px var(--sans);color:var(--muted)}.mmprof button .si{width:16px;height:16px}.mmprof button.on{background:linear-gradient(180deg,#e8c36a,#b8902e);color:#1a110a}
.mmstats{margin:8px 0 14px;font-size:12px;color:var(--muted)}
.mmmain{display:grid;gap:8px;margin:0 0 14px}.mmbig{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;font-size:18px;border-radius:16px}.mmbig .si{width:26px;height:26px}.mmbig span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}.mmbig small{font:500 11px var(--sans);letter-spacing:.5px;text-transform:none;opacity:.8}
.mmtiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.mmseed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px 0 0;padding:12px;border-radius:14px;background:#1a110a;border:1px solid var(--line)}.mmseed small{flex-basis:100%;font-size:11px;color:var(--muted)}
.mmdaily{margin:16px 0 0;font-size:12px;color:var(--muted)}.mmdaily .si{width:14px;height:14px;vertical-align:-2px;color:var(--brass2)}

/* main menu on wide screens: the title and big buttons on the left, larger tiles on the right */
@media (min-width:900px){
 .mmenu{max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px 40px;align-items:center;min-height:calc(100vh - 80px);text-align:left}
 .mmhero{display:flex;flex-direction:column;align-items:flex-start}.mmhero h1.neon.big{font-size:clamp(46px,5.2vw,76px);margin:0 0 4px;text-align:left}.mmenu .tagline{text-align:left;margin:0 0 22px}
 .mmstats{text-align:left;margin:10px 0 20px}.mmmain{width:100%;max-width:440px}.mmbig{min-height:76px;font-size:21px;justify-content:flex-start;padding-left:26px}.mmbig .si{width:30px;height:30px}
 .mmtiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mmtiles .stile{padding:18px 8px 15px;gap:6px}.mmtiles .stile .sic{width:54px;height:54px}.mmtiles .stile .sic .si{width:28px;height:28px}.mmtiles .stile b{font-size:15px}.mmtiles .stile small{font-size:12px}
 .mmdaily{text-align:left}
}
